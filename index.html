          <b:widget-setting name='content'><![CDATA[<!-- =========================================
     POPUP VENTANA EMERGENTE OSCURA
     TIPO MINI-WINDOW APP
========================================= -->

<script src="https://code.jquery.com/jquery-3.2.1.min.js"></script>
<script src="https://extassisnetwork.com/player/Luna/luna.js"></script>

<style>

/* ===== OVERLAY ===== */
#radioWindowOverlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.75);
  backdrop-filter:blur(8px);
  z-index:999999999;
  display:flex;
  align-items:center;
  justify-content:center;
  animation:fadeIn .4s ease;
  padding:15px;
}

/* ===== WINDOW ===== */
#radioWindow{
  width:420px;
  max-width:100%;
  height:620px;
  background:#0c0c14;
  border-radius:18px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,0.08);
  box-shadow:
    0 0 40px rgba(0,0,0,0.7),
    0 0 80px rgba(111,0,255,0.15);
  display:flex;
  flex-direction:column;
  position:relative;
  resize:both;
  min-width:320px;
  min-height:420px;
  animation:popupIn .4s cubic-bezier(.2,.8,.2,1);
}

/* ===== TOP BAR ===== */
#radioTopBar{
  height:52px;
  min-height:52px;
  background:linear-gradient(90deg,#12121d,#1a1a2e);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 12px;
  border-bottom:1px solid rgba(255,255,255,0.06);
  cursor:move;
  user-select:none;
}

/* ===== TITLE ===== */
#radioTitle{
  display:flex;
  align-items:center;
  gap:10px;
  color:white;
  font-size:14px;
  font-weight:700;
  letter-spacing:.5px;
}

#radioTitle img{
  width:28px;
  height:28px;
  border-radius:50%;
  object-fit:cover;
}

/* ===== WINDOW BUTTONS ===== */
.windowBtns{
  display:flex;
  align-items:center;
  gap:8px;
}

.windowBtn{
  width:34px;
  height:34px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-size:16px;
  color:white;
  transition:.25s;
  display:flex;
  align-items:center;
  justify-content:center;
}

.windowBtn:hover{
  transform:scale(1.08);
}

#minimizeBtn{
  background:#ffb100;
}

#maximizeBtn{
  background:#2f89ff;
}

#closeBtn{
  background:#ff2e2e;
}

/* ===== PLAYER AREA ===== */
#radioContent{
  flex:1;
  overflow:hidden;
  background:#080811;
  position:relative;
}

/* PLAYER */
#extassisnetwork{
  width:100% !important;
  height:100% !important;
}

/* ===== MINIMIZED ===== */
#radioWindow.minimized{
  height:52px !important;
  resize:none;
}

#radioWindow.minimized #radioContent{
  display:none;
}

/* ===== MAXIMIZED ===== */
#radioWindow.maximized{
  width:96vw !important;
  height:94vh !important;
}

/* ===== MOBILE ===== */
@media(max-width:600px){

  #radioWindow{
    width:100%;
    height:95vh;
    border-radius:16px;
  }

}

/* ===== ANIMATIONS ===== */
@keyframes fadeIn{
  from{opacity:0;}
  to{opacity:1;}
}

@keyframes popupIn{
  from{
    opacity:0;
    transform:scale(.85) translateY(40px);
  }
  to{
    opacity:1;
    transform:scale(1) translateY(0);
  }
}

</style>

<!-- =========================
     OVERLAY
========================= -->
<div id="radioWindowOverlay">

  <div id="radioWindow">

    <!-- TOP BAR -->
    <div id="radioTopBar">

      <div id="radioTitle">
        <img src="https://static.mytuner.mobi/media/tvos_radios/548/color-caribe-radio.3e65dc0b.png" />
        <span>COLOR CARIBE RADIO</span>
      </div>

      <div class="windowBtns">

        <!-- MINIMIZE -->
        <button class="windowBtn" id="minimizeBtn">—</button>

        <!-- MAXIMIZE -->
        <button class="windowBtn" id="maximizeBtn">□</button>

        <!-- CLOSE -->
        <button class="windowBtn" id="closeBtn">✕</button>

      </div>

    </div>

    <!-- CONTENT -->
    <div id="radioContent">

      <div id="extassisnetwork"></div>

    </div>

  </div>

</div>

<script>

$(document).ready(function(){

  /* =========================
     PLAYER
  ========================= */

  $("#extassisnetwork").lunaradio({

    streamurl: "https://stream-281.zeno.fm/sqfetz0whrhvv?zt=eyJhbGciOiJIUzI1NiJ9.eyJzdHJlYW0iOiJzcWZldHowd2hyaHZ2IiwiaG9zdCI6InN0cmVhbS0yODEuemVuby5mbSIsInRtIjpmYWxzZSwicnR0bCI6NSwianRpIjoieHFDaXgxVGZSajZQQVU4X3A5b2dFdyIsImlhdCI6MTc3ODY5NzE1MywiZXhwIjoxNzc4Njk3MjEzfQ.Ejw0PZxBzcgorYPtFSvTgP5r4U0QhAklgjDtKj8j7fo",

    radioname: "COLOR CARIBE RADIO",

    coverimage: "https://static.mytuner.mobi/media/tvos_radios/548/color-caribe-radio.3e65dc0b.png",

    onlycoverimage: false,

    userinterface: "big",

    backgroundcolor: "#0c0c14",

    fontcolor: "#ffffff",

    hightlightcolor: "#6f00ff",

    fontname: "Be Vietnam",

    googlefont: "Be Vietnam",

    fontratio: "0.4",

    scroll: "true",

    coverstyle: "animated",

    usevisualizer: "real",

    visualizertype: "6",

    streamtype: "shoutcast2",

    shoutcastpath: "/stream",

    shoutcastid: "1",

    metadatainterval: "5000",

    volume: "100",

    usestreamcorsproxy: "true",

    autoplay: "true"

  });

  /* =========================
     AUTOPLAY FORZADO
  ========================= */

  function forcePlay(){

    document.querySelectorAll("audio").forEach(function(audio){

      audio.volume = 1;
      audio.muted = false;

      let p = audio.play();

      if(p !== undefined){

        p.catch(function(){

          setTimeout(function(){

            audio.play().catch(()=>{});

          },1000);

        });

      }

    });

  }

  setTimeout(forcePlay,1000);
  setTimeout(forcePlay,2500);
  setTimeout(forcePlay,4500);

  document.addEventListener("click",forcePlay);
  document.addEventListener("touchstart",forcePlay);
  document.addEventListener("mousemove",forcePlay);

  /* =========================
     MINIMIZE
  ========================= */

  $("#minimizeBtn").click(function(){

    $("#radioWindow").toggleClass("minimized");

  });

  /* =========================
     MAXIMIZE
  ========================= */

  $("#maximizeBtn").click(function(){

    $("#radioWindow").toggleClass("maximized");

  });

  /* =========================
     CLOSE
  ========================= */

  $("#closeBtn").click(function(){

    $("#radioWindowOverlay").fadeOut(300);

  });

  /* =========================
     DRAG WINDOW
  ========================= */

  let isDragging = false;
  let offsetX = 0;
  let offsetY = 0;

  const radioWindow = document.getElementById("radioWindow");
  const topBar = document.getElementById("radioTopBar");

  topBar.addEventListener("mousedown", function(e){

    if(radioWindow.classList.contains("maximized")) return;

    isDragging = true;

    offsetX = e.clientX - radioWindow.offsetLeft;
    offsetY = e.clientY - radioWindow.offsetTop;

    radioWindow.style.position = "absolute";

  });

  document.addEventListener("mousemove", function(e){

    if(!isDragging) return;

    radioWindow.style.left = (e.clientX - offsetX) + "px";
    radioWindow.style.top = (e.clientY - offsetY) + "px";

  });

  document.addEventListener("mouseup", function(){

    isDragging = false;

  });

});

</script>]]></b:widget-setting>

<style>
#miPopupPublicidad {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.60); /* 60% transparencia */
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 99999;
}

.popup-contenido {
  position: relative;
  max-width: 75%;   /* reducido */
  max-height: 75%;  /* reducido */
  animation: aparecer 0.4s ease;
}

.popup-contenido img {
  width: 100%;
  max-width: 520px; /* antes 600px */
  border-radius: 10px; /* proporcional */
  box-shadow: 0 0 16px rgba(0,0,0,0.5);
  cursor: pointer;
}

.cerrar-popup {
  position: absolute;
  top: -8px;
  right: -8px;
  background: #fff;
  color: #000;
  font-size: 22px; /* reducido */
  font-weight: bold;
  width: 30px; /* reducido */
  height: 30px; /* reducido */
  text-align: center;
  line-height: 30px;
  border-radius: 50%;
  cursor: pointer;
}

@keyframes aparecer {
  from { transform: scale(0.75); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
</style>

<script>
document.addEventListener("DOMContentLoaded", function() {
  var popup = document.getElementById("miPopupPublicidad");
  var cerrar = document.querySelector(".cerrar-popup");

  popup.style.display = "flex";

  cerrar.onclick = function() {
    popup.style.display = "none";
  };

  popup.onclick = function(e) {
    if (e.target === popup) {
      popup.style.display = "none";
    }
  };
});
</script>]]></b:widget-setting>
