ges.unsplash.com/photo-1560523160-6328ab80fcfd?q=80&w=1200",resumen:"La Arenosa se alista para recibir una de las festividades más importantes del país con un despliegue logístico sin precedentes y la participación de más de 30 comparsas internacionales.",contenido:`<p>Barranquilla se prepara para vivir la edición 2026 del Carnaval, declarado Patrimonio Oral e Inmaterial de la Humanidad por la UNESCO. Este año se espera la llegada de más de 500 mil turistas nacionales e internacionales.</p>
<p>La alcaldía ha invertido más de 15 mil millones de pesos en logística, seguridad y adecuación de espacios públicos para garantizar que la fiesta transcurra sin contratiempos.</p>
<blockquote>"El Carnaval de Barranquilla es la máxima expresión de nuestra cultura. Este año tendremos la participación de 30 comparsas internacionales y más de 200 grupos folclóricos locales", afirmó la secretaria de Cultura.</blockquote>
<p>La programación incluye la tradicional Batalla de Flores, la Gran Parada de Tradición y el Festival de Orquestas, entre otros eventos que se extenderán durante cuatro días de celebración continua.</p>
<p>Las autoridades han dispuesto un plan especial de movilidad y recomiendan a los asistentes utilizar el transporte público para evitar congestiones en las principales vías de la ciudad.</p>`,destacada:!0},{id:"noticia-2",titulo:"Gobierno Nacional anuncia ambicioso plan de infraestructura para la región Caribe",categoria:"Nacional",fecha:"2026-03-14T14:30:00Z",imagen:"https://images.unsplash.com/photo-1590959651373-a3db0f38a6e3?q=80&w=800",resumen:"El presidente anunció inversiones por más de 8 billones de pesos para mejorar puertos, aeropuertos y vías en toda la región Caribe colombiana durante los próximos cinco años.",contenido:`<p>El Gobierno Nacional ha anunciado un ambicioso plan de infraestructura para la región Caribe colombiana que contempla inversiones por más de 8 billones de pesos durante los próximos cinco años.</p>
<p>El plan incluye la modernización del aeropuerto Ernesto Cortissoz de Barranquilla, la ampliación de la zona portuaria y la construcción de nuevas vías que conectarán a los departamentos de la región de manera más eficiente.</p>
<p>Según el Ministerio de Transporte, estas obras generarán más de 50 mil empleos directos e indirectos y reducirán los costos logísticos en un 30%, beneficiando especialmente a los sectores agrícola e industrial.</p>
<blockquote>"Esta es la inversión más grande en infraestructura que ha recibido la región Caribe en toda su historia", declaró el presidente durante el anuncio.</blockquote>
<p>Se espera que las primeras obras comiencen en el segundo semestre de 2026, con la adjudicación de las licitaciones prevista para mayo.</p>`},{id:"noticia-3",titulo:"ONU advierte sobre crisis climática: urge reducir emisiones antes de 2030",categoria:"Internacional",fecha:"2026-03-13T08:15:00Z",imagen:"https://images.unsplash.com/photo-1559589688-577aabd1db4f?q=80&w=800",resumen:"El último informe de Naciones Unidas alerta que el planeta superará los 1.5°C de calentamiento antes de lo previsto si no se toman medidas drásticas e inmediatas.",contenido:`<p>El último informe del Panel Intergubernamental sobre Cambio Climático (IPCC) de la ONU ha lanzado una advertencia sin precedentes: el planeta está en camino de superar el límite de 1.5°C de calentamiento global antes de 2030 si no se implementan reducciones drásticas e inmediatas de emisiones.</p>
<p>El documento señala que las emisiones globales de gases de efecto invernadero alcanzaron un récord histórico en 2025, impulsadas principalmente por el uso de combustibles fósiles en economías emergentes.</p>
<blockquote>"Estamos en una emergencia climática. Cada fracción de grado cuenta y cada año de retraso hace más difícil revertir el daño", señaló el secretario general de la ONU.</blockquote>
<p>Colombia, como país megadiverso, es particularmente vulnerable a los efectos del cambio climático. Expertos nacionales advierten sobre el aumento en la frecuencia de fenómenos extremos como sequías en la región Andina e inundaciones en la costa Caribe.</p>
<p>La próxima cumbre climática mundial, programada para noviembre en Nairobi, será decisiva para establecer nuevos compromisos vinculantes de reducción de emisiones.</p>`},{id:"noticia-4",titulo:"Selección Colombia Femenina hace historia: clasifica a semifinales del Mundial",categoria:"Deportes",fecha:"2026-03-12T18:45:00Z",imagen:"https://images.unsplash.com/photo-1529101091764-c3526daf38fe?q=80&w=800",resumen:"Las cafeteras vencieron 3-1 a Alemania en un partido memorable que las coloca entre las cuatro mejores selecciones del mundo por primera vez en la historia.",contenido:`<p>La Selección Colombia Femenina ha escrito una página dorada en la historia del fútbol nacional al clasificar por primera vez a las semifinales de una Copa Mundial, tras vencer de manera contundente 3-1 a Alemania en los cuartos de final.</p>
<p>Con goles de Linda Caicedo, Mayra Ramírez y Catalina Usme, el equipo dirigido por Angelo Marsiglia desplegó un fútbol ofensivo y vibrante que emocionó a millones de colombianos que madrugaron para seguir el partido.</p>
<blockquote>"Esto es un sueño hecho realidad. Llevamos años trabajando para este momento y ahora vamos por más. Colombia entera está con nosotras", declaró emocionada la capitana Catalina Usme.</blockquote>
<p>La semifinal se jugará el próximo viernes ante la selección de Inglaterra. Las autoridades locales ya preparan pantallas gigantes en Barranquilla, Bogotá y Medellín para que los aficionados puedan disfrutar del encuentro histórico.</p>
<p>El presidente de la República decretó que el viernes será día cívico para que todos los colombianos puedan acompañar a la selección en este crucial partido.</p>`},{id:"noticia-5",titulo:"Inversión extranjera en Colombia alcanza cifra récord durante primer trimestre",categoria:"Economía",fecha:"2026-03-11T09:20:00Z",imagen:"https://images.unsplash.com/photo-1543007630-9710e4a7a1c9?q=80&w=800",resumen:"La inversión extranjera directa superó los 4.500 millones de dólares entre enero y marzo, la cifra más alta registrada para un primer trimestre en la historia del país.",contenido:`<p>Colombia registró una inversión extranjera directa (IED) de 4.500 millones de dólares durante el primer trimestre de 2026, la cifra más alta para este período en la historia económica del país, según informó el Banco de la República.</p>
<p>Los sectores que más capital atrajeron fueron el energético, con especial énfasis en energías renovables, el tecnológico y el de infraestructura. Estados Unidos, España y China encabezan la lista de países inversionistas.</p>
<blockquote>"Colombia se está consolidando como un destino atractivo para la inversión gracias a su estabilidad jurídica y ubicación estratégica en América Latina", afirmó el ministro de Comercio.</blockquote>
<p>Analistas económicos proyectan que, de mantenerse esta tendencia, el país podría superar los 17 mil millones de dólares en IED al cierre del año, lo que representaría un incremento del 25% respecto al año anterior.</p>
<p>La Costa Caribe concentra el 35% del total de estas inversiones, consolidándose como polo de desarrollo económico en sectores como logística portuaria y energías limpias.</p>`},{id:"noticia-6",titulo:"Barranquilla inaugura primer centro de innovación tecnológica del Caribe colombiano",categoria:"Local",fecha:"2026-03-10T11:00:00Z",imagen:"https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=800",resumen:"El nuevo Centro de Innovación Tecnológica del Caribe abrió sus puertas con capacidad para albergar 200 startups y generar más de 5.000 empleos en el sector digital.",contenido:`<p>Barranquilla dio un paso firme hacia la transformación digital con la inauguración del primer Centro de Innovación Tecnológica del Caribe colombiano. El moderno edificio de 12 pisos, ubicado en el norte de la ciudad, tiene capacidad para albergar hasta 200 startups y empresas de base tecnológica.</p>
<p>El proyecto, que contó con una inversión público-privada de 120 mil millones de pesos, incluye laboratorios de inteligencia artificial, blockchain, robótica y realidad virtual, además de espacios de coworking y salas de conferencias con capacidad para 500 personas.</p>
<blockquote>"Queremos que Barranquilla se convierta en el Silicon Valley del Caribe. Este centro será el motor de la economía digital de nuestra región", expresó el alcalde durante la ceremonia de inauguración.</blockquote>
<p>Se estima que el centro generará más de 5.000 empleos directos en el sector digital en los próximos tres años, contribuyendo a diversificar la economía local y frenar la fuga de talento hacia otras ciudades del país.</p>`},{id:"noticia-7",titulo:"Conflicto en Ucrania: nuevo intento de tregua tras mediación latinoamericana",categoria:"Internacional",fecha:"2026-03-09T16:30:00Z",imagen:"https://images.unsplash.com/photo-1572947650440-e8a97ef053b2?q=80&w=800",resumen:"Una coalición de países latinoamericanos, liderada por Brasil y Colombia, presenta una propuesta de paz que incluye un cese al fuego de 90 días y diálogo multilateral.",contenido:`<p>Una coalición de países latinoamericanos, liderada por Brasil y Colombia, ha presentado ante la Asamblea General de la ONU una nueva propuesta de paz para el conflicto en Ucrania que incluye un cese al fuego inmediato de 90 días y el inicio de diálogos multilaterales.</p>
<p>La propuesta, que ha sido bien recibida por la comunidad internacional, plantea la creación de una zona desmilitarizada supervisada por fuerzas de paz de países no alineados y el establecimiento de corredores humanitarios para la población civil.</p>
<blockquote>"Latinoamérica ha demostrado históricamente que el diálogo puede resolver los conflictos más complejos. Ofrecemos nuestra experiencia y neutralidad para facilitar la paz", declaró el canciller colombiano.</blockquote>
<p>Expertos en relaciones internacionales señalan que esta iniciativa podría destrabar un conflicto que ya completa más de cuatro años y que ha causado una crisis humanitaria sin precedentes en Europa del Este.</p>`},{id:"noticia-8",titulo:"Reforma pensional: así quedarían las nuevas edades de jubilación en Colombia",categoria:"Política",fecha:"2026-03-08T07:45:00Z",imagen:"https://images.unsplash.com/photo-1464219222984-216ebffaaf85?q=80&w=800",resumen:"El Congreso debate el proyecto de ley que modificaría el sistema de pensiones con cambios graduales en las edades de retiro y un nuevo pilar solidario para los más vulnerables.",contenido:`<p>El Congreso de la República inició el debate del proyecto de reforma pensional que promete transformar el sistema actual con cambios graduales en las edades de jubilación y la creación de un nuevo pilar solidario para proteger a los colombianos más vulnerables.</p>
<p>La propuesta mantiene la edad de jubilación actual (57 años para mujeres y 62 para hombres) durante los próximos cinco años, tras los cuales se implementaría un incremento gradual de dos años para ambos géneros, pero con beneficios adicionales para quienes decidan postergar voluntariamente su retiro.</p>
<blockquote>"Esta reforma busca garantizar la sostenibilidad del sistema sin afectar los derechos adquiridos. El pilar solidario beneficiará a más de 3 millones de adultos mayores que hoy no tienen ninguna protección", explicó el ministro de Trabajo.</blockquote>
<p>Analistas financieros advierten que la reforma es necesaria ante el acelerado envejecimiento de la población, pero recomiendan que se acompañe de políticas de formalización laboral para que más trabajadores puedan cotizar.</p>`},{id:"noticia-9",titulo:"La Guacherna 2026 ilumina las calles de Barranquilla con récord de asistentes",categoria:"Entretenimiento",fecha:"2026-03-07T20:00:00Z",imagen:"https://images.unsplash.com/photo-1495020689067-958852a7765e?q=80&w=800",resumen:"Más de 300 mil personas participaron en el desfile nocturno que marca el inicio oficial de las precarnavales, con danzas, luces y la alegría que caracteriza a la ciudad.",contenido:`<p>La Guacherna 2026 marcó un hito en la historia del Carnaval de Barranquilla al congregar a más de 300 mil asistentes en las calles de la ciudad, superando todas las cifras de años anteriores y consolidándose como uno de los eventos más esperados de las fiestas.</p>
<p>El desfile, que comenzó a las 7 de la noche y se extendió hasta la madrugada, contó con la participación de más de 80 grupos de danza, 20 carrozas iluminadas y las tradicionales marimondas, monocucos y garabatos que dan vida a las expresiones más auténticas del folclor caribeño.</p>
<blockquote>"La Guacherna es la esencia de nuestro carnaval: el pueblo bailando en las calles, la música a todo volumen y esa energía que solo Barranquilla sabe transmitir", comentó la reina del Carnaval 2026.</blockquote>
<p>Las autoridades reportaron saldo blanco durante la jornada, resultado del dispositivo de seguridad que incluyó 3.000 policías, cámaras de vigilancia con reconocimiento facial y puestos de atención médica distribuidos a lo largo del recorrido.</p>
<p>Con la Guacherna, la ciudad entra oficialmente en modo carnaval, preparándose para la Batalla de Flores que se celebrará el próximo sábado.</p>`},{id:"noticia-10",titulo:"Avance científico: investigadores colombianos desarrollan vacuna contra el dengue",categoria:"Nacional",fecha:"2026-03-06T13:20:00Z",imagen:"https://images.unsplash.com/photo-1588681664899-f142ff2dc9b1?q=80&w=800",resumen:"Un equipo de la Universidad Nacional logra un avance significativo en la lucha contra el dengue con una vacuna que mostró 92% de efectividad en ensayos clínicos fase 2.",contenido:`<p>Un equipo de investigadores de la Universidad Nacional de Colombia ha logrado un avance científico que podría cambiar la salud pública en regiones tropicales: el desarrollo de una vacuna contra el dengue que ha mostrado un 92% de efectividad en ensayos clínicos fase 2.</p>
<p>La vacuna, denominada DENV-COL, utiliza una plataforma de ARN modificado similar a la empleada en algunas vacunas contra el COVID-19, pero adaptada para los cuatro serotipos del virus del dengue que circulan en el país.</p>
<blockquote>"Después de ocho años de investigación, estamos más cerca que nunca de controlar una enfermedad que afecta a millones de personas cada año. Colombia podría convertirse en referente mundial en inmunización tropical", afirmó la doctora Martínez, líder del equipo investigador.</blockquote>
